<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Soft outer drop shadow matching reference -->
    <filter id="circle-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <!-- Soft inner glow around the white 'm' glyph -->
    <filter id="m-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Solid Black Circular Disk -->
  <circle cx="50" cy="50" r="48" fill="#000000" filter="url(#circle-shadow)" />
  
  <!-- Subtle inner radial rim light -->
  <circle cx="50" cy="50" r="47.5" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  
  <!-- Sculpted bold white lowercase 'm' glyph -->
  <path
    d="M 23 72 V 42 C 23 30.5 31 23 41 23 C 47.5 23 50 28 50 32.5 C 50 28 52.5 23 59 23 C 69 23 77 30.5 77 42 V 72"
    stroke="white"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#m-glow)"
  />
</svg>
