<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <filter id="white-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Black Circular Background -->
  <circle cx="50" cy="50" r="48" fill="#000000" />
  
  <!-- Subtle inner radial glow -->
  <circle cx="50" cy="50" r="42" fill="white" fill-opacity="0.04" />
  
  <!-- Precision curved lowercase 'm' glyph matching Frame 2087329179.png -->
  <path
    d="M 24 66 V 42 C 24 33 30 27.5 38 27.5 C 44.5 27.5 48.5 31.5 50 35.5 C 51.5 31.5 55.5 27.5 62 27.5 C 70 27.5 76 33 76 42 V 66"
    stroke="white"
    stroke-width="9.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#white-glow)"
  />
</svg>
